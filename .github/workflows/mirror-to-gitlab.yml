name: Mirror to GitLab

on:
  push:
  delete:
  workflow_dispatch:

concurrency:
  group: mirror-to-gitlab
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push all branches and tags to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git push --prune "https://oauth2:${GITLAB_TOKEN}@gitlab.com/2t-studios-group/SurvivalGame2026.git" \
            '+refs/remotes/origin/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'
